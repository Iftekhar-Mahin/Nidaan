<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      .paper { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .header-title { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 22px; fill: #0284c7; }
      .header-sub { font-family: 'Inter', sans-serif; font-size: 12px; fill: #64748b; }
      .doctor-name { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
      .doctor-degree { font-family: 'Inter', sans-serif; font-size: 12px; fill: #475569; }
      .rx-symbol { font-family: 'Times New Roman', serif; font-weight: bold; font-style: italic; font-size: 38px; fill: #0284c7; }
      .printed-med { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; fill: #0f172a; }
      .printed-dose { font-family: 'Inter', sans-serif; font-size: 14px; fill: #334155; }
      .printed-inst { font-family: 'Inter', sans-serif; font-style: italic; font-size: 13px; fill: #64748b; }
      .barcode { fill: #0f172a; }
      .rx-card { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>

  <rect x="10" y="10" width="780" height="1080" rx="8" class="paper" />
  
  <!-- Hospital Header -->
  <rect x="30" y="30" width="740" height="100" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
  
  <rect x="50" y="50" width="60" height="60" rx="8" fill="#0284c7" />
  <text x="80" y="88" font-family="'Inter', sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">SH</text>
  
  <text x="130" y="65" class="header-title">SQUARE HOSPITALS LTD.</text>
  <text x="130" y="85" class="header-sub">18/F, Bir Uttam Qazi Nuruzzaman Sarak, West Panthapath, Dhaka 1205</text>
  <text x="130" y="105" class="header-sub">Tel: +880 2 8159457 | Web: www.squarehospital.com | NABH &amp; JCI Accredited</text>

  <!-- Doctor & Patient Banner -->
  <line x1="30" y1="145" x2="770" y2="145" stroke="#cbd5e1" stroke-width="1.5" />
  
  <text x="40" y="170" class="doctor-name">Dr. Nusrat Jahan</text>
  <text x="40" y="190" class="doctor-degree">MBBS, FCPS (Medicine), MD (Cardiology)</text>
  <text x="40" y="210" class="doctor-degree">Associate Professor &amp; Senior Consultant Cardiologist</text>
  
  <line x1="420" y1="150" x2="420" y2="225" stroke="#e2e8f0" stroke-width="1" />
  
  <text x="440" y="170" font-family="'Inter', sans-serif" font-size="13px" fill="#0f172a"><tspan font-weight="bold">UHID:</tspan> SQ-2026-98124</text>
  <text x="440" y="190" font-family="'Inter', sans-serif" font-size="13px" fill="#0f172a"><tspan font-weight="bold">Patient:</tspan> Kazi Farhan Ahmed (Age: 38Y / M)</text>
  <text x="440" y="210" font-family="'Inter', sans-serif" font-size="13px" fill="#0f172a"><tspan font-weight="bold">Date:</tspan> 14-Aug-2026 10:45 AM</text>

  <line x1="30" y1="230" x2="770" y2="230" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Vitals Bar -->
  <rect x="30" y="240" width="740" height="35" rx="4" fill="#f1f5f9" />
  <text x="50" y="263" font-family="'Inter', sans-serif" font-size="12px" font-weight="600" fill="#334155">BP: 138/88 mmHg  |  Pulse: 76 bpm  |  SpO2: 98%  |  Weight: 74 kg  |  BMI: 24.8</text>

  <!-- Rx symbol -->
  <text x="40" y="315" class="rx-symbol">℞</text>
  <text x="75" y="312" font-family="'Inter', sans-serif" font-size="14px" font-weight="700" fill="#0284c7">MEDICATION ADVICE (PRESCRIPTION)</text>

  <!-- Medication List (Printed) -->
  <!-- Med 1 -->
  <g transform="translate(30, 330)">
    <rect x="0" y="0" width="740" height="80" rx="6" class="rx-card" />
    <text x="25" y="30" class="printed-med">1. Tab. Bizoran 5/20 mg</text>
    <text x="280" y="30" class="printed-dose">1 + 0 + 0 (Daily Morning)</text>
    <text x="540" y="30" font-family="'Inter', sans-serif" font-weight="600" font-size="14px" fill="#0284c7">Duration: 90 Days</text>
    <text x="25" y="58" class="printed-inst">Generic: Amlodipine 5mg + Olmesartan Medoxomil 20mg | Take after breakfast with water</text>
  </g>

  <!-- Med 2 -->
  <g transform="translate(30, 425)">
    <rect x="0" y="0" width="740" height="80" rx="6" class="rx-card" />
    <text x="25" y="30" class="printed-med">2. Tab. Rostar 10 mg</text>
    <text x="280" y="30" class="printed-dose">0 + 0 + 1 (Daily Night)</text>
    <text x="540" y="30" font-family="'Inter', sans-serif" font-weight="600" font-size="14px" fill="#0284c7">Duration: 90 Days</text>
    <text x="25" y="58" class="printed-inst">Generic: Rosuvastatin 10mg | Take after dinner at bedtime</text>
  </g>

  <!-- Med 3 -->
  <g transform="translate(30, 520)">
    <rect x="0" y="0" width="740" height="80" rx="6" class="rx-card" />
    <text x="25" y="30" class="printed-med">3. Tab. Sergel 20 mg</text>
    <text x="280" y="30" class="printed-dose">1 + 0 + 1 (Twice Daily)</text>
    <text x="540" y="30" font-family="'Inter', sans-serif" font-weight="600" font-size="14px" fill="#0284c7">Duration: 30 Days</text>
    <text x="25" y="58" class="printed-inst">Generic: Esomeprazole 20mg | Take 30 minutes before meal</text>
  </g>

  <!-- Med 4 -->
  <g transform="translate(30, 615)">
    <rect x="0" y="0" width="740" height="80" rx="6" class="rx-card" />
    <text x="25" y="30" class="printed-med">4. Tab. Coral-D</text>
    <text x="280" y="30" class="printed-dose">0 + 1 + 0 (Daily Midday)</text>
    <text x="540" y="30" font-family="'Inter', sans-serif" font-weight="600" font-size="14px" fill="#0284c7">Duration: 30 Days</text>
    <text x="25" y="58" class="printed-inst">Generic: Calcium Carbonate + Vit D3 | Take after lunch</text>
  </g>

  <!-- Non-pharmacological Advice -->
  <rect x="30" y="715" width="740" height="120" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="50" y="745" font-family="'Inter', sans-serif" font-weight="700" font-size="14px" fill="#0f172a">General Advice &amp; Lifestyle Management:</text>
  <text x="50" y="775" font-family="'Inter', sans-serif" font-size="13px" fill="#475569">• Low salt diet (&lt; 5g/day), avoid fried &amp; high cholesterol foods.</text>
  <text x="50" y="800" font-family="'Inter', sans-serif" font-size="13px" fill="#475569">• Brisk walk 30-40 minutes at least 5 days a week.</text>
  <text x="50" y="825" font-family="'Inter', sans-serif" font-size="13px" fill="#475569">• Follow up after 3 months with Lipid Profile &amp; Serum Creatinine.</text>

  <!-- Footer with Barcode and E-Signature -->
  <line x1="30" y1="890" x2="770" y2="890" stroke="#cbd5e1" stroke-width="1.5" />
  
  <g transform="translate(50, 915)">
    <rect x="0" y="0" width="180" height="35" fill="#e2e8f0" />
    <text x="90" y="22" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">*SQ202698124*</text>
    <text x="90" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Computer Generated E-Prescription</text>
  </g>

  <g transform="translate(520, 910)">
    <text x="120" y="25" font-family="'Caveat', cursive" font-size="28" fill="#0284c7" text-anchor="middle">Nusrat Jahan</text>
    <line x1="20" y1="35" x2="220" y2="35" stroke="#94a3b8" />
    <text x="120" y="55" font-family="'Inter', sans-serif" font-size="11" fill="#475569" text-anchor="middle">Electronically Verified by Dr. Nusrat Jahan</text>
    <text x="120" y="70" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">BMDC Reg: A-45219</text>
  </g>
</svg>
